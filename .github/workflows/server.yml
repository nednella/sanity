name: Server

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter "@sanity/server..." typecheck

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm exec eslint apps/server packages

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @sanity/server test

  openapi:
    name: OpenAPI
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    env:
      CORS_ORIGIN: http://localhost
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      HOST: 127.0.0.1
      LOG_LEVEL: silent
      PORT: 3000
      WOM_API_KEY: ci
      WOM_GROUP_ID: 0
      WOM_USER_AGENT: ci
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @sanity/server openapi
      - run: pnpm --filter @sanity/api openapi
      - run: git diff --exit-code apps/server/openapi.json packages/api/src/v1.d.ts
